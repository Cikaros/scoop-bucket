name: Validate Scoop Manifests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate each manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          if (-not (Test-Path $bucketDir)) {
            Write-Error "bucket 目录不存在: $bucketDir"
            exit 1
          }
          $manifests = Get-ChildItem -Path $bucketDir -Filter *.json
          if (-not $manifests) {
            Write-Error "在 $bucketDir 没找到任何 manifest"
            exit 1
          }
          $failed = @()
          foreach ($m in $manifests) {
            $name = $m.BaseName
            Write-Host ""
            Write-Host "校验中: $name" -ForegroundColor Cyan

            try {
              $manifest = Get-Content $m.FullName -Raw | ConvertFrom-Json
            } catch {
              Write-Host "  -> 失败：JSON 解析错误" -ForegroundColor Red
              Write-Host "     $_" -ForegroundColor Red
              $failed += $name
              continue
            }

            $errors = @()
            if (-not $manifest.version) { $errors += "缺少必填字段 'version'" }
            if (-not $manifest.description) { $errors += "缺少必填字段 'description'（推荐）" }
            if (-not $manifest.homepage) { $errors += "缺少必填字段 'homepage'" }
            if (-not $manifest.license) { $errors += "缺少必填字段 'license'" }
            if (-not $manifest.url) { $errors += "缺少必填字段 'url'" }

            if ($manifest.autoupdate) { $errors += "包含禁用字段 'autoupdate'（违反版本锁定承诺）" }
            if ($manifest.checkver) { $errors += "包含禁用字段 'checkver'（违反版本锁定承诺）" }

            $warnings = @()
            if ($manifest._comment) { $warnings += "包含已废弃字段 '_comment'（请用 '##' 代替）" }
            if ($manifest.msi) { $warnings += "包含已废弃字段 'msi'（省略即可触发 zip 解压行为）" }
            if ($manifest.cookie) { $warnings += "包含未文档化字段 'cookie'（不推荐使用）" }

            if ($errors.Count -gt 0) {
              Write-Host "  -> 失败" -ForegroundColor Red
              foreach ($e in $errors) { Write-Host "     - $e" -ForegroundColor Red }
              $failed += $name
            } else {
              Write-Host "  -> 通过" -ForegroundColor Green
            }
            if ($warnings.Count -gt 0) {
              foreach ($w in $warnings) { Write-Host "     ! $w" -ForegroundColor Yellow }
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Error "以下 manifest 校验失败: $($failed -join ', ')"
            exit 1
          }
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host " 所有 $($manifests.Count) 个 manifest 校验通过！" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green

      - name: Generate MANIFESTS.md
        shell: pwsh
        run: |
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $manifests = Get-ChildItem -Path $bucketDir -Filter *.json | Sort-Object Name
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC')

          $content = @()
          $content += '# Manifests'
          $content += ''
          $content += '> 本文件由 `Validate Scoop Manifests` GitHub Action 自动生成，请勿手动编辑。'
          $content += '> This file is automatically generated by the `Validate Scoop Manifests` GitHub Action. Do not edit manually.'
          $content += ''
          $content += "> Last updated: $now"
          $content += ''
          $content += '## 摘要表 / Summary'
          $content += ''
          $content += '| Package | Version | Description |'
          $content += '|---------|---------|-------------|'

          foreach ($m in $manifests) {
            $manifest = Get-Content $m.FullName -Raw | ConvertFrom-Json
            $name = $m.BaseName
            $version = $manifest.version
            $desc = $manifest.description
            if ($desc) {
              $desc = $desc -replace '\|', '\|'
              $desc = $desc -replace "`r`n", ' '
              $desc = $desc -replace "`n", ' '
              $desc = $desc.Trim()
            } else {
              $desc = '(no description)'
            }
            $content += "| ``$name`` | $version | $desc |"
          }

          $content += ''
          $content += "**总计 / Total: $($manifests.Count) 个 manifest**"
          $content += ''
          $content += '---'
          $content += ''
          $content += '## 字段速查 / Field Reference'
          $content += ''
          $content += '下表展示每个 manifest 用到的关键 Scoop 字段，便于横向对比。'
          $content += ''
          $content += '| Package | installer | pre_install | post_install | env_set | persist | bin |'
          $content += '|---------|-----------|-------------|--------------|---------|---------|-----|'

          foreach ($m in $manifests) {
            $manifest = Get-Content $m.FullName -Raw | ConvertFrom-Json
            $name = $m.BaseName

            $installer = if ($manifest.installer) { '✓' } else { '—' }
            $preInstall = if ($manifest.pre_install) { '✓' } else { '—' }
            $postInstall = if ($manifest.post_install) { '✓' } else { '—' }
            $envSet = if ($manifest.env_set) {
              ($manifest.env_set.PSObject.Properties.Name) -join ', '
            } else { '—' }
            $persist = if ($manifest.persist) {
              $items = @()
              foreach ($p in $manifest.persist) {
                if ($p -is [array]) { $items += $p[0] } else { $items += $p }
              }
              $items -join ', '
            } else { '—' }
            $bin = if ($manifest.bin) {
              $items = @()
              foreach ($b in $manifest.bin) {
                if ($b -is [array]) { $items += $b[0] } else { $items += $b }
              }
              $items.Count.ToString() + ' entries'
            } else { '—' }

            $content += "| ``$name`` | $installer | $preInstall | $postInstall | $envSet | $persist | $bin |"
          }

          $content += ''
          $content += '---'
          $content += ''
          $content += '## 如何更新'
          $content += ''
          $content += '- 本文件由 `.github/workflows/validate-manifests.yml` workflow 在每次 push 到 `main` / `master` 时自动重新生成并提交。'
          $content += '- 如需新增 manifest，请按 [CONTRIBUTING.md](CONTRIBUTING.md) 流程操作；推送后 CI 会自动更新本文件。'
          $content += '- **请勿手动编辑本文件** —— 下次 CI 跑完会覆盖手动修改。'
          $content += ''

          $content -join "`r`n" | Set-Content -Path MANIFESTS.md -Encoding utf8
          Write-Host "已生成 MANIFESTS.md（$($manifests.Count) 个 manifest）"

      - name: Commit MANIFESTS.md
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MANIFESTS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "MANIFESTS.md 无变化，跳过提交"
          } else {
            git commit -m "chore: auto-update MANIFESTS.md [skip ci]"
            git push
            Write-Host "已提交 MANIFESTS.md" -ForegroundColor Green
          }

      - name: Show MANIFESTS.md preview
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Write-Host "=== MANIFESTS.md 预览（PR 不会自动提交，请检查后手动合并到 main） ===" -ForegroundColor Cyan
          Get-Content MANIFESTS.md