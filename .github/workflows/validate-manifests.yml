name: Validate Scoop Manifests  # 校验所有 Scoop manifest 并自动生成 MANIFESTS.md

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write  # 允许 CI 把生成的 MANIFESTS.md 推回仓库

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository  # 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Scoop  # 安装 Scoop 并把 shims 路径写入 GITHUB_PATH
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          # 关键：把 scoop 的 shims 目录写入 GITHUB_PATH，让后续步骤可以直接调用 scoop
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Scoop installation  # 验证 scoop 可调用
        shell: pwsh
        run: |
          scoop --version
          Write-Host "Scoop 已安装并可用" -ForegroundColor Green

      - name: Add this bucket  # 把当前仓库作为 bucket 添加进去
        shell: pwsh
        run: |
          scoop bucket add mybucket "${{ github.workspace }}"

      - name: Validate each manifest JSON  # 逐个校验 bucket 目录下的 JSON manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $manifests = Get-ChildItem -Path $bucketDir -Filter *.json
          if (-not $manifests) {
            Write-Error "在 $bucketDir 没找到任何 manifest"
            exit 1
          }
          $failed = @()
          foreach ($m in $manifests) {
            $name = $m.BaseName
            Write-Host "校验中: $name"
            $output = & scoop cat $name 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  -> 失败" -ForegroundColor Red
              Write-Host $output
              $failed += $name
            } else {
              Write-Host "  -> 通过" -ForegroundColor Green
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "以下 manifest 校验失败: $($failed -join ', ')"
            exit 1
          }
          Write-Host ""
          Write-Host "所有 manifest 校验通过！" -ForegroundColor Green

      - name: Generate MANIFESTS.md  # 根据校验通过的 manifest 自动生成 MANIFESTS.md
        shell: pwsh
        run: |
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $manifests = Get-ChildItem -Path $bucketDir -Filter *.json | Sort-Object Name
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC')

          $content = @()
          $content += '# Manifests'
          $content += ''
          $content += '> 本文件由 `Validate Scoop Manifests` GitHub Action 自动生成，请勿手动编辑。'
          $content += '> This file is automatically generated by the `Validate Scoop Manifests` GitHub Action. Do not edit manually.'
          $content += ''
          $content += "> Last updated: $now"
          $content += ''
          $content += '## 摘要表 / Summary'
          $content += ''
          $content += '| Package | Version | Description |'
          $content += '|---------|---------|-------------|'

          foreach ($m in $manifests) {
            $manifest = Get-Content $m.FullName -Raw | ConvertFrom-Json
            $name = $m.BaseName
            $version = $manifest.version
            $desc = $manifest.description
            # 转义可能破坏 Markdown 表格的字符
            if ($desc) {
              $desc = $desc -replace '\|', '\|'
              $desc = $desc -replace "`r`n", ' '
              $desc = $desc -replace "`n", ' '
              $desc = $desc.Trim()
            } else {
              $desc = '(no description)'
            }
            $content += "| ``$name`` | $version | $desc |"
          }

          $content += ''
          $content += "**总计 / Total: $($manifests.Count) 个 manifest**"
          $content += ''
          $content += '---'
          $content += ''
          $content += '## 字段速查 / Field Reference'
          $content += ''
          $content += '下表展示每个 manifest 用到的关键 Scoop 字段，便于横向对比。'
          $content += ''
          $content += '| Package | installer | pre_install | post_install | env_set | persist | bin |'
          $content += '|---------|-----------|-------------|--------------|---------|---------|-----|'

          foreach ($m in $manifests) {
            $manifest = Get-Content $m.FullName -Raw | ConvertFrom-Json
            $name = $m.BaseName

            $installer = if ($manifest.installer) { '✓' } else { '—' }
            $preInstall = if ($manifest.pre_install) { '✓' } else { '—' }
            $postInstall = if ($manifest.post_install) { '✓' } else { '—' }
            $envSet = if ($manifest.env_set) {
              ($manifest.env_set.PSObject.Properties.Name) -join ', '
            } else { '—' }
            $persist = if ($manifest.persist) {
              $items = @()
              foreach ($p in $manifest.persist) {
                if ($p -is [array]) { $items += $p[0] } else { $items += $p }
              }
              $items -join ', '
            } else { '—' }
            $bin = if ($manifest.bin) {
              $items = @()
              foreach ($b in $manifest.bin) {
                if ($b -is [array]) { $items += $b[0] } else { $items += $b }
              }
              $items.Count.ToString() + ' entries'
            } else { '—' }

            $content += "| ``$name`` | $installer | $preInstall | $postInstall | $envSet | $persist | $bin |"
          }

          $content += ''
          $content += '---'
          $content += ''
          $content += '## 如何更新'
          $content += ''
          $content += '- 本文件由 `.github/workflows/validate-manifests.yml` workflow 在每次 push 到 `main` / `master` 时自动重新生成并提交。'
          $content += '- 如需新增 manifest，请按 [CONTRIBUTING.md](CONTRIBUTING.md) 流程操作；推送后 CI 会自动更新本文件。'
          $content += '- **请勿手动编辑本文件** —— 下次 CI 跑完会覆盖手动修改。'
          $content += ''

          $content -join "`r`n" | Set-Content -Path MANIFESTS.md -Encoding utf8
          Write-Host "已生成 MANIFESTS.md（$($manifests.Count) 个 manifest）"

      - name: Commit MANIFESTS.md  # 把生成的 MANIFESTS.md 提交回仓库（仅在 push 到 main/master 时）
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MANIFESTS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "MANIFESTS.md 无变化，跳过提交"
          } else {
            git commit -m "chore: auto-update MANIFESTS.md [skip ci]"
            git push
            Write-Host "已提交 MANIFESTS.md" -ForegroundColor Green
          }

      - name: Show MANIFESTS.md preview  # 在 PR 上不会提交，但输出预览供审查
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Write-Host "=== MANIFESTS.md 预览（PR 不会自动提交，请检查后手动合并到 main） ===" -ForegroundColor Cyan
          Get-Content MANIFESTS.md
